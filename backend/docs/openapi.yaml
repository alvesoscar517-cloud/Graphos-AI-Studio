openapi: 3.0.3
info:
  title: AI Content Authenticator API
  description: |
    Backend API for AI Content Authenticator - A service for detecting AI-generated content,
    analyzing text authenticity, and providing humanization features.
    
    ## Authentication
    Most endpoints require authentication via Bearer token in the Authorization header.
    - **Firebase Auth**: Use Firebase ID token
    - **Email Auth**: Use access token from login endpoint
    
    ## Rate Limiting
    - 60 requests per minute per user
    - 429 status code when exceeded
    
    ## Credits System
    AI-consuming operations require credits. Check `/api/credits/balance` for current balance.
  version: 2.1.0
  contact:
    email: support@graphosai.com
  license:
    name: Proprietary

servers:
  - url: https://graphosai-472729326429.us-central1.run.app
    description: Production server
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Health
    description: Health check endpoints
  - name: Email Auth
    description: Email/password authentication
  - name: Profiles
    description: User writing profile management
  - name: Analysis
    description: AI detection and text analysis
  - name: Chat
    description: AI chat with workspace context
  - name: Credits
    description: Credit balance and purchases
  - name: Notifications
    description: User notifications

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token or Email auth access token

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid input provided
            errorId:
              type: string
              example: a1b2c3d4

    User:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        picture:
          type: string
          format: uri
        emailVerified:
          type: boolean
        hasGoogleLinked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        sampleCount:
          type: integer
        status:
          type: string
          enum: [draft, finalized]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AnalysisResult:
      type: object
      properties:
        aiProbability:
          type: number
          minimum: 0
          maximum: 100
          description: Probability that content is AI-generated
        confidence:
          type: number
          minimum: 0
          maximum: 100
        evidence:
          type: array
          items:
            type: string
        humanIndicators:
          type: array
          items:
            type: string
        aiIndicators:
          type: array
          items:
            type: string

    CreditBalance:
      type: object
      properties:
        balance:
          type: integer
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
        monthlyCredits:
          type: integer
        usedThisMonth:
          type: integer

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    InsufficientCredits:
      description: Insufficient credits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                  version:
                    type: string
                  uptime:
                    type: number

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service not ready

  # Email Authentication
  /auth/email/register:
    post:
      tags: [Email Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
                locale:
                  type: string
                  default: en
      responses:
        '200':
          description: Registration successful, verification email sent
        '400':
          description: Invalid input
        '409':
          description: Email already registered

  /auth/email/verify:
    post:
      tags: [Email Auth]
      summary: Verify email with OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        '200':
          description: Email verified, returns auth tokens

  /auth/email/login:
    post:
      tags: [Email Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '403':
          description: Email not verified

  /auth/email/refresh:
    post:
      tags: [Email Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New tokens issued

  /auth/email/forgot-password:
    post:
      tags: [Email Auth]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent

  /auth/email/reset-password:
    post:
      tags: [Email Auth]
      summary: Reset password with OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful

  /auth/email/change-password:
    post:
      tags: [Email Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/email/sessions:
    get:
      tags: [Email Auth]
      summary: Get active sessions
      responses:
        '200':
          description: List of active sessions

  /auth/email/sessions/{sessionId}:
    delete:
      tags: [Email Auth]
      summary: Revoke a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked

  # Profiles
  /profiles:
    get:
      tags: [Profiles]
      summary: Get all user profiles
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'

  /profiles/create:
    post:
      tags: [Profiles]
      summary: Create new profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Profile created

  /profiles/{id}:
    get:
      tags: [Profiles]
      summary: Get profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile details
        '404':
          description: Profile not found
    delete:
      tags: [Profiles]
      summary: Delete profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile deleted

  /profiles/add-sample:
    post:
      tags: [Profiles]
      summary: Add writing sample to profile
      description: Requires credits for embedding generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId, text]
              properties:
                profileId:
                  type: string
                text:
                  type: string
                  minLength: 100
      responses:
        '200':
          description: Sample added
        '402':
          $ref: '#/components/responses/InsufficientCredits'

  /profiles/finalize:
    post:
      tags: [Profiles]
      summary: Finalize profile
      description: Generates voice profile. Requires credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId:
                  type: string
      responses:
        '200':
          description: Profile finalized
        '402':
          $ref: '#/components/responses/InsufficientCredits'

  # Analysis
  /analysis/authenticate:
    post:
      tags: [Analysis]
      summary: Detect AI-generated content
      description: Analyzes text to determine if it was AI-generated. Requires credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 50
                  description: Text to analyze
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    $ref: '#/components/schemas/AnalysisResult'
        '402':
          $ref: '#/components/responses/InsufficientCredits'

  /analysis/analyze:
    post:
      tags: [Analysis]
      summary: Analyze text against profile
      description: Compares text against user's writing profile. Requires credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, profileId]
              properties:
                text:
                  type: string
                profileId:
                  type: string
      responses:
        '200':
          description: Analysis result
        '402':
          $ref: '#/components/responses/InsufficientCredits'

  /analysis/rewrite:
    post:
      tags: [Analysis]
      summary: Rewrite text
      description: Rewrites text to match user's writing style. Requires credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, profileId]
              properties:
                text:
                  type: string
                profileId:
                  type: string
                style:
                  type: string
                  enum: [formal, casual, academic, creative]
      responses:
        '200':
          description: Rewritten text
        '402':
          $ref: '#/components/responses/InsufficientCredits'

  /analysis/rewrite-stream:
    post:
      tags: [Analysis]
      summary: Rewrite text (streaming)
      description: Same as /rewrite but returns Server-Sent Events stream
      responses:
        '200':
          description: SSE stream of rewritten text

  /analysis/translate:
    post:
      tags: [Analysis]
      summary: Translate text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, targetLanguage]
              properties:
                text:
                  type: string
                targetLanguage:
                  type: string
                  example: vi
      responses:
        '200':
          description: Translated text

  /analysis/check-humanization:
    post:
      tags: [Analysis]
      summary: Check humanization level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Humanization score

  /analysis/iterative-humanize:
    post:
      tags: [Analysis]
      summary: Iteratively humanize text
      description: Repeatedly humanizes text until target score reached
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                targetScore:
                  type: number
                  default: 85
                maxIterations:
                  type: integer
                  default: 3
      responses:
        '200':
          description: Humanized text

  # Chat
  /api/chat:
    post:
      tags: [Chat]
      summary: Send chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                workspaceId:
                  type: string
                conversationId:
                  type: string
      responses:
        '200':
          description: Chat response
        '402':
          $ref: '#/components/responses/InsufficientCredits'

  /api/chat/stream:
    post:
      tags: [Chat]
      summary: Send chat message (streaming)
      description: Returns Server-Sent Events stream
      responses:
        '200':
          description: SSE stream

  /api/chat/humanized:
    post:
      tags: [Chat]
      summary: Send humanized chat message
      description: Chat response is humanized. Higher credit cost.
      responses:
        '200':
          description: Humanized chat response

  # Credits
  /api/credits/balance:
    get:
      tags: [Credits]
      summary: Get credit balance
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CreditBalance'

  /api/credits/packages:
    get:
      tags: [Credits]
      summary: Get available credit packages
      responses:
        '200':
          description: List of packages

  /api/credits/history:
    get:
      tags: [Credits]
      summary: Get credit usage history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Credit history

  # Notifications
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Get user notifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of notifications

  /api/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read

  # Feedback
  /send-feedback:
    post:
      tags: [Health]
      summary: Send feedback or support ticket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                type:
                  type: string
                  enum: [feedback, billing_support]
                category:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                title:
                  type: string
                content:
                  type: string
                userEmail:
                  type: string
                userName:
                  type: string
      responses:
        '200':
          description: Feedback submitted
