<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Authenticator - Shared Content</title>
  <meta name="description" content="View shared content from AI Content Authenticator">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #c62828 0%, #8b1a1a 100%);
      padding: 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .logo svg {
      width: 48px;
      height: 48px;
      color: white;
    }

    h1 {
      color: white;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      position: relative;
      z-index: 1;
    }

    .content {
      padding: 48px;
    }

    .loading {
      text-align: center;
      padding: 40px 0;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #5f6368;
      font-size: 16px;
    }

    .error {
      text-align: center;
      padding: 40px 0;
    }

    .error-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      opacity: 0.5;
    }

    .error-title {
      color: #202124;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .error-message {
      color: #5f6368;
      font-size: 16px;
      margin-bottom: 32px;
    }

    .install-prompt {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 32px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 32px;
    }

    .install-prompt h2 {
      color: #202124;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .install-prompt p {
      color: #5f6368;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .shared-content {
      margin-bottom: 32px;
    }

    .content-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f1f3f4;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 16px;
    }

    .content-badge svg {
      width: 16px;
      height: 16px;
    }

    .content-title {
      color: #202124;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .content-meta {
      color: #5f6368;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .content-body {
      background: #f8f9fa;
      padding: 24px;
      border-radius: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .note-content {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.6;
      color: #202124;
    }

    .conversation {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .message-avatar svg {
      width: 18px;
      height: 18px;
    }

    .message.user .message-avatar svg {
      color: white;
    }

    .message-content {
      flex: 1;
      max-width: 70%;
    }

    .message-role {
      font-size: 11px;
      font-weight: 600;
      color: #5f6368;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .message-text {
      background: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      color: #202124;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .message-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .btn-secondary {
      background: white;
      color: #5f6368;
      border: 2px solid #dadce0;
    }

    .btn-secondary:hover {
      background: #f8f9fa;
      border-color: #5f6368;
    }

    .btn svg {
      width: 20px;
      height: 20px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .content {
        padding: 32px 24px;
      }

      .header {
        padding: 24px;
      }

      h1 {
        font-size: 24px;
      }

      .message-content {
        max-width: 80%;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h1>AI Content Authenticator</h1>
      <p class="subtitle">Shared Content</p>
    </div>

    <div class="content">
      <!-- Loading State -->
      <div id="loadingState" class="loading">
        <div class="spinner"></div>
        <p class="loading-text">Đang tải nội dung...</p>
      </div>

      <!-- Error State -->
      <div id="errorState" class="error" style="display: none;">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h2 class="error-title">Không thể tải nội dung</h2>
        <p class="error-message" id="errorMessage"></p>
      </div>

      <!-- Content State -->
      <div id="contentState" style="display: none;">
        <!-- Install Prompt (shown if extension not installed) -->
        <div id="installPrompt" class="install-prompt" style="display: none;">
          <h2>📥 Cài đặt Extension để xem đầy đủ</h2>
          <p>Để xem và nhập nội dung này vào ứng dụng của bạn, vui lòng cài đặt AI Content Authenticator extension.</p>
          <a href="#" id="installBtn" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Cài đặt Extension
          </a>
        </div>

        <!-- Shared Content -->
        <div class="shared-content">
          <div class="content-badge" id="contentBadge"></div>
          <h2 class="content-title" id="contentTitle"></h2>
          <p class="content-meta" id="contentMeta"></p>
          <div class="content-body" id="contentBody"></div>
        </div>

        <!-- Actions -->
        <div class="actions">
          <button class="btn btn-secondary" onclick="window.close()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            Đóng
          </button>
          <button class="btn btn-primary" id="openInExtensionBtn" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            Mở trong Extension
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = window.location.origin;
    
    // Get share ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const shareId = urlParams.get('share');

    // Check if extension is installed
    function isExtensionInstalled() {
      return typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.id;
    }

    // Load shared content
    async function loadContent() {
      if (!shareId) {
        showError('Không tìm thấy mã chia sẻ trong URL');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/share/${shareId}`);
        
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('Nội dung không tồn tại hoặc đã bị xóa');
          }
          if (response.status === 410) {
            throw new Error('Nội dung đã hết hạn');
          }
          throw new Error('Không thể tải nội dung');
        }

        const data = await response.json();
        displayContent(data);
      } catch (error) {
        console.error('Load error:', error);
        showError(error.message);
      }
    }

    // Display content
    function displayContent(data) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('contentState').style.display = 'block';

      // Show install prompt if extension not installed
      if (!isExtensionInstalled()) {
        document.getElementById('installPrompt').style.display = 'block';
        document.getElementById('installBtn').href = 'https://chromewebstore.google.com/detail/ai-content-authenticator/YOUR_EXTENSION_ID';
      } else {
        document.getElementById('openInExtensionBtn').style.display = 'inline-flex';
      }

      // Content badge
      const badge = document.getElementById('contentBadge');
      if (data.type === 'conversation') {
        badge.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          Cuộc trò chuyện
        `;
      } else {
        badge.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          Văn bản
        `;
      }

      // Title and meta
      document.getElementById('contentTitle').textContent = data.title;
      const createdDate = new Date(data.createdAt).toLocaleDateString('vi-VN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
      document.getElementById('contentMeta').textContent = `Được chia sẻ vào ${createdDate}`;

      // Content body
      const contentBody = document.getElementById('contentBody');
      if (data.type === 'note') {
        contentBody.innerHTML = `<div class="note-content">${escapeHtml(data.content)}</div>`;
      } else if (data.type === 'conversation' && data.messages) {
        const messagesHtml = data.messages.map(msg => `
          <div class="message ${msg.role === 'user' ? 'user' : 'assistant'}">
            <div class="message-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                ${msg.role === 'user' 
                  ? '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>'
                  : '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>'
                }
              </svg>
            </div>
            <div class="message-content">
              <div class="message-role">${msg.role === 'user' ? 'Bạn' : 'AI'}</div>
              <div class="message-text">${escapeHtml(msg.content)}</div>
            </div>
          </div>
        `).join('');
        contentBody.innerHTML = `<div class="conversation">${messagesHtml}</div>`;
      }

      // Open in extension button
      document.getElementById('openInExtensionBtn').onclick = () => {
        if (isExtensionInstalled()) {
          window.location.href = `chrome-extension://${chrome.runtime.id}/index.html?share=${shareId}`;
        }
      };
    }

    // Show error
    function showError(message) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      document.getElementById('errorMessage').textContent = message;
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load content on page load
    loadContent();
  </script>
</body>
</html>
